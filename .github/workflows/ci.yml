name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RhiLinux.sln
      - run: dotnet format RhiLinux.sln --no-restore --verify-no-changes
      - run: dotnet build RhiLinux.sln -c Release --no-restore
      - run: dotnet test RhiLinux.sln -c Release --no-build --logger trx
